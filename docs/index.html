<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vesbo Documentation — Language & 2D Game Runtime</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Vesbo: an English-readable programming language, bytecode VM, C embedding library, and 2D game scripting runtime.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #38bdf8;
      --base-background-color: #0f172a;
      --sidebar-background: #0b1120;
      --code-theme-background: #1e293b;
      --heading-color: #f8fafc;
      --base-color: #e2e8f0;
    }
    .sidebar-nav > ul > li > p {
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      margin-top: 1.2em;
    }
  </style>
</head>
<body>
  <div id="app">Loading Vesbo documentation...</div>
  <script>
    window.$docsify = {
      name: 'Vesbo',
      repo: 'https://github.com/Vsbs14/Vesbo',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results found.',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script>
    if (window.Prism) {
      Prism.languages.vsb = Prism.languages.extend('python', {
        'comment': /--.*/,
        'keyword': /\b(?:var|global|is|set|to|fnc|ft|gives|return|struct|self|if|else|loop|while|till|from|through|as|try|catch|import|coroutine|yield|AND|OR|NOT|and|or|not|equals|does|less|greater|than|equal|true|false|none|output)\b/
      });
    }
  </script>
</body>
</html>
