<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Vesbo Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Vesbo — scripting language, bytecode VM, and 2D game runtime in C.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vesbo-color-scheme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       COLOR PALETTE — Dark (ink & muted teal) + Light mode
       Clean sans-serif (Inter) for prose/headings, monospace only for code
       ============================================================ */
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f14;
      --bg-sidebar: #0e131a;
      --bg-panel: #131922;
      --bg-hover: #18202c;
      --border: #212a35;
      --text: #e6e8eb;
      --text-muted: #98a2ad;
      --text-faint: #687382;
      --accent: #7dd8c8;
      --accent-dim: #4d8f83;
      --nav-bg: rgba(11, 15, 20, 0.88);
      --code-kw: #7dd8c8;
      --code-str: #a5d6a7;
      --code-num: #82aaff;
      --code-fn: #e6e8eb;
      --code-comment: #63707e;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8f7f4;
      --bg-sidebar: #f1efe9;
      --bg-panel: #eae7df;
      --bg-hover: #e2dfd5;
      --border: #d6d2c6;
      --text: #161a20;
      --text-muted: #4b5563;
      --text-faint: #717a86;
      --accent: #0f766e;
      --accent-dim: #2b8a7e;
      --nav-bg: rgba(248, 247, 244, 0.9);
      --code-kw: #0f766e;
      --code-str: #286930;
      --code-num: #255499;
      --code-fn: #161a20;
      --code-comment: #76808f;
    }

    :root {
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sidebar-w: 268px;
      --nav-h: 54px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    ::selection {
      background: var(--accent-dim);
      color: #ffffff;
    }

    /* ---------- TOP BAR ---------- */
    header.site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      color: var(--text);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand:hover { text-decoration: none; }
    .brand-sub {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-faint);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13.5px;
    }

    .nav-right a {
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-right a:hover {
      color: var(--text);
      text-decoration: none;
    }

    .theme-btn,
    .menu-btn {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .theme-btn:hover,
    .menu-btn:hover {
      border-color: var(--accent-dim);
      background: var(--bg-hover);
    }
    .theme-btn svg {
      width: 14px;
      height: 14px;
      color: var(--accent);
    }

    .menu-btn { display: none; }

    /* ---------- SIDEBAR ---------- */
    main {
      display: block;
      padding-top: var(--nav-h);
    }

    .sidebar {
      position: fixed;
      top: var(--nav-h);
      bottom: 0;
      left: 0;
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 0 48px;
      z-index: 40;
      transition: transform 0.2s ease;
    }

    .sidebar > h1.app-name { display: none; }
    .sidebar-toggle { display: none !important; }
    .github-corner { display: none !important; }

    /* Search input */
    .search {
      padding: 0 18px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .search .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: border-color 0.15s ease;
    }
    .search .input-wrap:focus-within {
      border-color: var(--accent-dim);
    }
    .search input[type="search"] {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 11px;
      outline: none;
    }
    .search input[type="search"]::placeholder {
      color: var(--text-faint);
    }
    .search .clear-button { display: none; }
    .search .results-panel { margin-top: 10px; }
    .search .matching-post {
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
    }
    .search .matching-post h2 {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 3px;
    }
    .search .matching-post p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.45;
    }

    /* Sidebar Navigation */
    .sidebar-nav {
      padding: 0 16px;
    }
    .sidebar-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .sidebar-nav > ul > li {
      margin-bottom: 20px;
    }
    .sidebar-nav > ul > li > p {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0 8px;
      margin-bottom: 6px;
    }
    .sidebar-nav ul ul li {
      margin: 2px 0;
    }
    .sidebar-nav a {
      display: block;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 400;
      padding: 6px 10px;
      border-radius: 5px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: var(--text);
      background: var(--bg-hover);
      text-decoration: none;
    }
    .sidebar-nav li.active > a,
    .sidebar-nav a.active {
      color: var(--accent);
      background: var(--bg-panel);
      font-weight: 500;
    }
    /* Sub-headings inside current page */
    .sidebar-nav ul ul ul {
      padding-left: 12px;
      margin: 3px 0 6px;
      border-left: 1px solid var(--border);
      margin-left: 10px;
    }
    .sidebar-nav ul ul ul a {
      font-size: 12.5px;
      color: var(--text-faint);
      padding: 4px 8px;
    }

    /* ---------- MAIN CONTENT ---------- */
    .content {
      margin-left: var(--sidebar-w);
      min-height: calc(100vh - var(--nav-h));
    }

    .markdown-section {
      max-width: 820px;
      margin: 0 auto;
      padding: 44px 40px 96px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: var(--sans);
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a,
    .markdown-section h4 a {
      color: inherit;
      text-decoration: none;
    }

    .markdown-section h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 16px;
    }

    .markdown-section h2 {
      font-size: 1.38rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 40px 0 14px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .markdown-section h1 + p + h2,
    .markdown-section h1 + h2 {
      border-top: none;
      padding-top: 0;
      margin-top: 28px;
    }

    .markdown-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 28px 0 10px;
    }

    .markdown-section h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin: 20px 0 8px;
    }

    .markdown-section p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .markdown-section ul,
    .markdown-section ol {
      color: var(--text-muted);
      padding-left: 22px;
      margin-bottom: 18px;
    }

    .markdown-section li {
      margin-bottom: 6px;
      line-height: 1.65;
    }

    .markdown-section strong {
      color: var(--text);
      font-weight: 600;
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .markdown-section blockquote {
      border-left: 3px solid var(--accent-dim);
      padding: 6px 0 6px 16px;
      margin: 18px 0;
      color: var(--text-muted);
      background: transparent;
    }
    .markdown-section blockquote p {
      margin: 0;
    }

    /* Inline code & Code blocks (JetBrains Mono) */
    .markdown-section code {
      font-family: var(--mono);
      background: var(--bg-panel);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
    }

    .markdown-section pre {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      margin: 16px 0 22px;
      overflow-x: auto;
      position: relative;
      line-height: 1.65;
    }

    .markdown-section pre > code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 13px;
      display: block;
    }

    /* Copy code button */
    .docsify-copy-code-button {
      background: var(--bg) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      font-family: var(--sans) !important;
      font-size: 11.5px !important;
      padding: 4px 9px !important;
      top: 8px !important;
      right: 8px !important;
    }
    .docsify-copy-code-button:hover {
      color: var(--text) !important;
      border-color: var(--accent-dim) !important;
    }

    /* Tables */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 28px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .markdown-section th,
    .markdown-section td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      vertical-align: top;
    }
    .markdown-section th:last-child,
    .markdown-section td:last-child {
      border-right: none;
    }
    .markdown-section tr:last-child td {
      border-bottom: none;
    }
    .markdown-section th {
      background: var(--bg-panel);
      color: var(--text);
      font-weight: 600;
      font-size: 12.5px;
    }
    .markdown-section td {
      color: var(--text-muted);
    }

    /* Syntax highlighting */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata { color: var(--code-comment); font-style: italic; }
    .token.keyword,
    .token.operator,
    .token.boolean { color: var(--code-kw); }
    .token.string,
    .token.char,
    .token.attr-value { color: var(--code-str); }
    .token.number { color: var(--code-num); }
    .token.function,
    .token.class-name { color: var(--code-fn); }
    .token.punctuation { color: var(--text-muted); }

    /* Responsive mobile */
    @media (max-width: 820px) {
      header.site-nav { padding: 0 16px; }
      .menu-btn { display: inline-flex; }
      .sidebar {
        transform: translateX(-100%);
      }
      body.sidebar-open .sidebar {
        transform: translateX(0);
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.35);
      }
      .content {
        margin-left: 0;
      }
      .markdown-section {
        padding: 28px 20px 72px;
      }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="nav-left">
      <button class="menu-btn" id="menu-toggle" type="button" aria-label="Toggle navigation">Menu</button>
      <a class="brand" href="#/">Vesbo <span class="brand-sub">Docs</span></a>
    </div>
    <div class="nav-right">
      <a href="https://github.com/Vsbs14/Vesbo" target="_blank" rel="noopener">GitHub</a>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </header>

  <div id="app">Loading...</div>

  <script>
    (function () {
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="color-scheme"]');
      var btn = document.getElementById('theme-toggle');
      var label = document.getElementById('theme-label');
      var menuBtn = document.getElementById('menu-toggle');

      function syncLabel(theme) {
        if (label) {
          label.textContent = (theme === 'dark') ? 'Light' : 'Dark';
        }
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        if (meta) meta.content = theme;
        try {
          localStorage.setItem('vesbo-color-scheme', theme);
        } catch (e) {}
        syncLabel(theme);
      }

      syncLabel(root.getAttribute('data-theme') || 'dark');

      if (btn) {
        btn.addEventListener('click', function () {
          var current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
          setTheme(current === 'dark' ? 'light' : 'dark');
        });
      }

      window.addEventListener('storage', function (e) {
        if (e.key === 'vesbo-color-scheme' && (e.newValue === 'light' || e.newValue === 'dark')) {
          root.setAttribute('data-theme', e.newValue);
          if (meta) meta.content = e.newValue;
          syncLabel(e.newValue);
        }
      });

      if (menuBtn) {
        menuBtn.addEventListener('click', function () {
          document.body.classList.toggle('sidebar-open');
        });
      }

      window.addEventListener('hashchange', function () {
        document.body.classList.remove('sidebar-open');
      });
    })();

    window.$docsify = {
      name: 'Vesbo',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script>
    if (window.Prism) {
      Prism.languages.vsb = Prism.languages.extend('python', {
        'comment': /--.*/,
        'keyword': /\b(?:var|global|is|set|to|fnc|ft|gives|return|struct|self|if|else|loop|while|till|from|through|as|try|catch|import|coroutine|yield|AND|OR|NOT|and|or|not|equals|does|less|greater|than|equal|true|false|none|output)\b/
      });
    }
  </script>
</body>
</html>
