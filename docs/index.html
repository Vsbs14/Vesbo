<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Vesbo — Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Vesbo, a scripting language, bytecode VM, and 2D game runtime written in C.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vesbo-color-scheme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0e14'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%237dd8c8' font-family='monospace'%3Ev_%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       DESIGN SYSTEM — matched to vsbs14.github.io
       ============================================================ */
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #0a0e14;
      --panel: #131922;
      --line: #212a35;
      --bone: #e8e6df;
      --bone-dim: #8993a0;
      --teal: #7dd8c8;
      --teal-dim: #4d8f83;
      --slate: #6f93c9;
      --muted: #7d8997;
      --nav-bg: rgba(10, 14, 20, 0.88);
      --code-kw: #7dd8c8;
      --code-str: #a5d6a7;
      --code-num: #6f93c9;
      --code-fn: #e8e6df;
      --code-comment: #63707e;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #f6f4ee;
      --panel: #ece8de;
      --line: #d4cfc3;
      --bone: #141920;
      --bone-dim: #4a5462;
      --teal: #0f766e;
      --teal-dim: #2b8a7e;
      --slate: #355c96;
      --muted: #687382;
      --nav-bg: rgba(246, 244, 238, 0.9);
      --code-kw: #0f766e;
      --code-str: #2e6b34;
      --code-num: #355c96;
      --code-fn: #141920;
      --code-comment: #76808f;
    }

    :root {
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Fraunces', serif;
      --s0: 8px;
      --s1: 13px;
      --s2: 21px;
      --s3: 34px;
      --s4: 55px;
      --sidebar-w: 270px;
      --nav-h: 56px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.65;
      min-height: 100vh;
    }

    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
    ::selection { background: var(--teal-dim); color: var(--ink); }

    /* ---------- TOP SITE NAV ---------- */
    header.site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 var(--s3);
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: var(--s2);
    }

    .brand {
      color: var(--bone);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .brand:hover { text-decoration: none; }
    .brand span { color: var(--teal); }

    .nav-path {
      color: var(--teal-dim);
      font-size: 11px;
      padding-left: var(--s2);
      border-left: 1px solid var(--line);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: var(--s2);
    }

    .nav-right a {
      color: var(--bone-dim);
      transition: color 0.15s ease;
    }
    .nav-right a:hover {
      color: var(--teal);
      text-decoration: none;
    }

    .theme-btn,
    .menu-btn {
      background: var(--panel);
      color: var(--bone);
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 6px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .theme-btn:hover,
    .menu-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }
    .theme-btn .dot {
      width: 7px;
      height: 7px;
      background: var(--teal);
      display: inline-block;
    }

    .menu-btn { display: none; }

    /* ---------- DOCSIFY LAYOUT OVERRIDES ---------- */
    main {
      display: block;
      padding-top: var(--nav-h);
    }

    .sidebar {
      position: fixed;
      top: var(--nav-h);
      bottom: 0;
      left: 0;
      width: var(--sidebar-w);
      background: var(--ink);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: var(--s2) 0 var(--s4);
      z-index: 40;
      transition: transform 0.2s ease;
    }

    .sidebar > h1.app-name { display: none; }
    .sidebar-toggle { display: none !important; }
    .github-corner { display: none !important; }

    /* Search box inside sidebar */
    .search {
      padding: 0 var(--s2) var(--s2);
      border-bottom: 1px solid var(--line);
      margin-bottom: var(--s2);
    }
    .search .input-wrap {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .search input[type="search"] {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--bone);
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
    }
    .search input[type="search"]::placeholder {
      color: var(--muted);
    }
    .search .clear-button {
      display: none;
    }
    .search .results-panel {
      margin-top: var(--s1);
    }
    .search .matching-post {
      border-bottom: 1px solid var(--line);
      padding: var(--s0) 0;
    }
    .search .matching-post h2 {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--teal);
      margin: 0 0 4px;
    }
    .search .matching-post p {
      font-size: 11px;
      color: var(--bone-dim);
      margin: 0;
    }

    /* Sidebar Navigation Links */
    .sidebar-nav {
      padding: 0 var(--s2);
    }
    .sidebar-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .sidebar-nav > ul > li {
      margin-bottom: var(--s2);
    }
    .sidebar-nav > ul > li > p {
      font-size: 11px;
      color: var(--teal-dim);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .sidebar-nav ul ul li {
      margin: 2px 0;
    }
    .sidebar-nav a {
      display: block;
      color: var(--bone-dim);
      font-size: 12.5px;
      padding: 4px 0 4px 10px;
      border-left: 1px solid var(--line);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: var(--teal);
      border-left-color: var(--teal-dim);
      text-decoration: none;
    }
    .sidebar-nav li.active > a,
    .sidebar-nav a.active {
      color: var(--teal);
      border-left: 2px solid var(--teal);
      font-weight: 500;
    }
    /* Sub-headers inside active page */
    .sidebar-nav ul ul ul {
      padding-left: 10px;
      margin: 4px 0;
    }
    .sidebar-nav ul ul ul a {
      font-size: 11.5px;
      color: var(--muted);
      padding: 2px 0 2px 10px;
    }

    /* ---------- MAIN CONTENT AREA ---------- */
    .content {
      margin-left: var(--sidebar-w);
      min-height: calc(100vh - var(--nav-h));
    }

    .markdown-section {
      max-width: 860px;
      margin: 0 auto;
      padding: var(--s4) var(--s3) 96px;
    }

    /* Typography matching portfolio */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: var(--serif);
      font-weight: 500;
      color: var(--bone);
      letter-spacing: -0.01em;
    }

    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a,
    .markdown-section h4 a {
      color: inherit;
      text-decoration: none;
    }

    .markdown-section h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.08;
      margin: 0 0 var(--s2);
    }

    .markdown-section h2 {
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      line-height: 1.15;
      margin: var(--s4) 0 var(--s2);
      padding-top: var(--s2);
      border-top: 1px solid var(--line);
    }

    .markdown-section h1 + p + h2,
    .markdown-section h1 + h2 {
      border-top: none;
      padding-top: 0;
    }

    .markdown-section h3 {
      font-size: 1.2rem;
      margin: var(--s3) 0 var(--s1);
    }

    .markdown-section h4 {
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--teal);
      margin: var(--s2) 0 var(--s0);
    }

    .markdown-section p {
      color: var(--bone-dim);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: var(--s2);
      max-width: 72ch;
    }

    .markdown-section ul,
    .markdown-section ol {
      color: var(--bone-dim);
      padding-left: var(--s2);
      margin-bottom: var(--s2);
    }

    .markdown-section li {
      margin-bottom: 6px;
      line-height: 1.65;
    }

    .markdown-section strong {
      color: var(--bone);
      font-weight: 500;
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: var(--s3) 0;
    }

    .markdown-section blockquote {
      border-left: 2px solid var(--teal-dim);
      padding: var(--s0) 0 var(--s0) var(--s2);
      margin: var(--s2) 0;
      color: var(--bone-dim);
      background: transparent;
    }
    .markdown-section blockquote p {
      margin: 0;
    }

    /* Inline code & terminal blocks */
    .markdown-section code {
      font-family: var(--mono);
      background: var(--panel);
      color: var(--teal);
      border: 1px solid var(--line);
      padding: 1px 6px;
      font-size: 12.5px;
    }

    .markdown-section pre {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: var(--s2);
      margin: var(--s2) 0;
      overflow-x: auto;
      position: relative;
      line-height: 1.7;
    }

    .markdown-section pre > code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--bone);
      font-size: 12.5px;
      display: block;
    }

    /* Copy code button */
    .docsify-copy-code-button {
      background: var(--ink) !important;
      color: var(--bone-dim) !important;
      border: 1px solid var(--line) !important;
      font-family: var(--mono) !important;
      font-size: 11px !important;
      padding: 4px 8px !important;
      top: 8px !important;
      right: 8px !important;
      opacity: 0.85 !important;
    }
    .docsify-copy-code-button:hover {
      color: var(--teal) !important;
      border-color: var(--teal-dim) !important;
      opacity: 1 !important;
    }

    /* Tables */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--s2) 0 var(--s3);
      font-size: 13px;
      border: 1px solid var(--line);
    }
    .markdown-section th,
    .markdown-section td {
      text-align: left;
      padding: 10px 13px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: top;
    }
    .markdown-section th {
      background: var(--panel);
      color: var(--bone);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .markdown-section td {
      color: var(--bone-dim);
    }

    /* Prism syntax tokens */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata { color: var(--code-comment); font-style: italic; }
    .token.keyword,
    .token.operator,
    .token.boolean { color: var(--code-kw); }
    .token.string,
    .token.char,
    .token.attr-value { color: var(--code-str); }
    .token.number { color: var(--code-num); }
    .token.function,
    .token.class-name { color: var(--code-fn); }
    .token.punctuation { color: var(--bone-dim); }

    /* Responsive mobile layout */
    @media (max-width: 820px) {
      header.site-nav { padding: 0 var(--s2); }
      .nav-path { display: none; }
      .menu-btn { display: inline-flex; }
      .sidebar {
        transform: translateX(-100%);
      }
      body.sidebar-open .sidebar {
        transform: translateX(0);
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
      }
      .content {
        margin-left: 0;
      }
      .markdown-section {
        padding: var(--s3) var(--s2) 72px;
      }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="nav-left">
      <button class="menu-btn" id="menu-toggle" type="button" aria-label="Toggle navigation">menu</button>
      <a class="brand" href="#/">vesbo<span>_</span>docs</a>
      <span class="nav-path" id="nav-breadcrumb">~ / docs</span>
    </div>
    <div class="nav-right">
      <a href="https://github.com/Vsbs14/Vesbo" target="_blank" rel="noopener">github →</a>
      <a href="https://vsbs14.github.io/" target="_blank" rel="noopener">vihan_singh →</a>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <span class="dot"></span>
        <span id="theme-label">light mode</span>
      </button>
    </div>
  </header>

  <div id="app">Loading...</div>

  <script>
    (function () {
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="color-scheme"]');
      var btn = document.getElementById('theme-toggle');
      var label = document.getElementById('theme-label');
      var menuBtn = document.getElementById('menu-toggle');
      var crumb = document.getElementById('nav-breadcrumb');

      function syncLabel(theme) {
        if (label) {
          label.textContent = (theme === 'dark') ? 'light mode' : 'dark mode';
        }
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        if (meta) meta.content = theme;
        try {
          localStorage.setItem('vesbo-color-scheme', theme);
        } catch (e) {}
        syncLabel(theme);
      }

      syncLabel(root.getAttribute('data-theme') || 'dark');

      if (btn) {
        btn.addEventListener('click', function () {
          var current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
          setTheme(current === 'dark' ? 'light' : 'dark');
        });
      }

      window.addEventListener('storage', function (e) {
        if (e.key === 'vesbo-color-scheme' && (e.newValue === 'light' || e.newValue === 'dark')) {
          root.setAttribute('data-theme', e.newValue);
          if (meta) meta.content = e.newValue;
          syncLabel(e.newValue);
        }
      });

      if (menuBtn) {
        menuBtn.addEventListener('click', function () {
          document.body.classList.toggle('sidebar-open');
        });
      }

      window.addEventListener('hashchange', function () {
        document.body.classList.remove('sidebar-open');
        if (crumb) {
          var h = (window.location.hash || '#/').replace(/^#\//, '').replace(/\.md$/, '');
          crumb.textContent = h ? ('~ / docs / ' + h) : '~ / docs';
        }
      });
    })();

    window.$docsify = {
      name: 'vesbo_docs',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '$ grep docs...',
        noData: 'no matches found.',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script>
    if (window.Prism) {
      Prism.languages.vsb = Prism.languages.extend('python', {
        'comment': /--.*/,
        'keyword': /\b(?:var|global|is|set|to|fnc|ft|gives|return|struct|self|if|else|loop|while|till|from|through|as|try|catch|import|coroutine|yield|AND|OR|NOT|and|or|not|equals|does|less|greater|than|equal|true|false|none|output)\b/
      });
    }
  </script>
</body>
</html>
